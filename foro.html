<!DOCTYPE html>
<html lang="es">
<head>
  <script>
    // Foro: integración con backend (/api/forum/*)
    (function(){
      const API_URL = window.API_URL || 'https://cartera-pr-pia.onrender.com';

      async function getCurrentUser(){
        const username = sessionStorage.getItem('usuario_actual');
        const password = sessionStorage.getItem('pass_actual');
        if(!username || !password) return null;
        try{
          const resp = await fetch(API_URL + '/me', { headers: { 'x-username': username, 'x-password': password } });
          if(!resp.ok) return null;
          return await resp.json();
        }catch(e){ console.warn('getCurrentUser error', e); return null; }
      }

      function showSession(me){
        try{
          const formWrap = document.getElementById('formWrap');
          const sessionInfo = document.getElementById('sessionInfo');
          const uNombre = document.getElementById('uNombre');
          const uRol = document.getElementById('uRol');
          if(me){
            if(formWrap) formWrap.style.display='none';
            if(sessionInfo) sessionInfo.style.display='block';
            if(uNombre) uNombre.textContent = me.username || '';
            if(uRol) uRol.textContent = me.role || '';
            const panel = document.getElementById('panelModerador'); if(panel) panel.style.display = (me.role === 'ADMINISTRADOR') ? 'block' : 'none';
          } else {
            if(formWrap) formWrap.style.display='block';
            if(sessionInfo) sessionInfo.style.display='none';
            const panel = document.getElementById('panelModerador'); if(panel) panel.style.display = 'none';
          }
        }catch(e){ console.warn('showSession error', e); }
      }

      async function loadQuestions(){
        try{
          const resp = await fetch(API_URL + '/api/forum/questions');
          if(!resp.ok) throw new Error('Error cargando preguntas');
          const qs = await resp.json();
          const me = await getCurrentUser();
          renderQuestionList(qs, me && me.role ? me.role : null);
        }catch(e){ console.error(e); const cont = document.getElementById('preguntas'); if(cont) cont.textContent = 'Error cargando preguntas'; }
      }

      function renderQuestionList(questions, role){
        const wrap = document.getElementById('preguntas'); if(!wrap) return; wrap.innerHTML = '';
        questions.forEach(q => {
          const card = document.createElement('div'); card.className = 'question-card';
          const header = document.createElement('div'); header.className = 'q-header';
          const title = document.createElement('h4'); title.textContent = q.title;
          const meta = document.createElement('div'); meta.className = 'q-meta'; meta.textContent = `by ${q.author} · ${q.answers_count} respuestas`;
          const body = document.createElement('div'); body.className = 'q-text'; body.textContent = q.body || '';
          header.appendChild(title); header.appendChild(meta);
          card.appendChild(header); card.appendChild(body);

          const actions = document.createElement('div'); actions.className = 'q-actions';
          const viewBtn = document.createElement('button'); viewBtn.textContent = 'Ver'; viewBtn.className='btn';
          viewBtn.addEventListener('click', ()=> showQuestionDetail(q.id)); actions.appendChild(viewBtn);
          if(role === 'COLABORADOR' || role === 'ADMINISTRADOR'){
            const ansBtn = document.createElement('button'); ansBtn.textContent = 'Responder'; ansBtn.className='btn'; ansBtn.addEventListener('click', ()=> showAnswerPrompt(q.id)); actions.appendChild(ansBtn);
          }
          if(role === 'ADMINISTRADOR'){
            const del = document.createElement('button'); del.textContent = 'Eliminar'; del.className='btn btn-borrar'; del.addEventListener('click', ()=> deleteQuestion(q.id)); actions.appendChild(del);
          }
          card.appendChild(actions);
          wrap.appendChild(card);
        });
      }

      async function showQuestionDetail(qid){
        try{
          const resp = await fetch(API_URL + '/api/forum/questions/' + qid);
          if(!resp.ok) { alert('Pregunta no encontrada'); return; }
          const j = await resp.json();
          const wrap = document.getElementById('preguntas'); wrap.innerHTML = '';
          const q = j.question;
          const card = document.createElement('div'); card.className='question-card';
          const title = document.createElement('h3'); title.textContent = q.title; const body = document.createElement('div'); body.className='q-text'; body.textContent = q.body || '';
          card.appendChild(title); card.appendChild(body);
          const answersDiv = document.createElement('div'); answersDiv.id = 'answers'; answersDiv.className='answers';
          j.answers.forEach(a=>{
            const ad = document.createElement('div'); ad.className='answer'; const abody = document.createElement('p'); abody.textContent = a.body; const ameta = document.createElement('small'); ameta.textContent = 'by ' + a.author;
            ad.appendChild(abody); ad.appendChild(ameta);
            answersDiv.appendChild(ad);
          });
          card.appendChild(answersDiv);
          const back = document.createElement('button'); back.textContent='Volver'; back.className='btn'; back.addEventListener('click', loadQuestions);
          card.appendChild(back);
          const me = await getCurrentUser();
          if(me && (me.role === 'COLABORADOR' || me.role === 'ADMINISTRADOR')){
            const af = document.createElement('div'); af.innerHTML = '<h4>Responder</h4><textarea id="answerBody" rows="3"></textarea><br><button id="sendAnswer" class="btn">Enviar</button>';
            card.appendChild(af);
            setTimeout(()=>{ const btn = document.getElementById('sendAnswer'); if(btn) btn.addEventListener('click', async ()=>{
              const bodyTxt = document.getElementById('answerBody').value.trim(); if(!bodyTxt) return alert('Escribe la respuesta');
              const username = sessionStorage.getItem('usuario_actual'); const pass = sessionStorage.getItem('pass_actual');
              const r = await fetch(API_URL + '/api/forum/questions/' + qid + '/answers', { method: 'POST', headers: {'Content-Type':'application/json','x-username':username,'x-password':pass}, body: JSON.stringify({ body: bodyTxt }) });
              if(!r.ok) { alert('Error al enviar'); return; }
              await showQuestionDetail(qid);
            }); }, 10);
          }
          wrap.appendChild(card);
        }catch(e){ console.error(e); }
      }

      async function showAnswerPrompt(qid){
        const ans = prompt('Escribe tu respuesta:'); if(!ans) return;
        const username = sessionStorage.getItem('usuario_actual'); const pass = sessionStorage.getItem('pass_actual');
        if(!username || !pass) return alert('Inicia sesión');
        try{
          const resp = await fetch(API_URL + '/api/forum/questions/' + qid + '/answers', { method: 'POST', headers: {'Content-Type':'application/json','x-username':username,'x-password':pass}, body: JSON.stringify({ body: ans }) });
          if(!resp.ok) return alert('Error al responder');
          await loadQuestions();
        }catch(e){ console.error(e); alert('Error'); }
      }

      async function deleteQuestion(qid){
        if(!confirm('Eliminar pregunta?')) return;
        const username = sessionStorage.getItem('usuario_actual'); const pass = sessionStorage.getItem('pass_actual');
        try{
          const r = await fetch(API_URL + '/api/forum/questions/' + qid, { method: 'DELETE', headers: {'x-username':username,'x-password':pass} });
          if(!r.ok) return alert('Error eliminando');
          await loadQuestions();
        }catch(e){ console.error(e); alert('Error'); }
      }

      // publicar pregunta
      document.getElementById('publicar').addEventListener('click', async ()=>{
        const txt = document.getElementById('pregunta').value.trim(); if(!txt) return alert('Escribe la pregunta');
        const username = sessionStorage.getItem('usuario_actual'); const pass = sessionStorage.getItem('pass_actual');
        if(!username || !pass) return alert('Inicia sesión');
        try{
          const r = await fetch(API_URL + '/api/forum/questions', { method: 'POST', headers: {'Content-Type':'application/json','x-username':username,'x-password':pass}, body: JSON.stringify({ title: txt.substring(0,80), body: txt }) });
          if(!r.ok) return alert('Error al publicar');
          document.getElementById('pregunta').value = '';
          await loadQuestions();
        }catch(e){ console.error(e); alert('Error'); }
      });

      // solicitar rol respondedor -> usar endpoint /role-requests
      document.getElementById('solicitar').addEventListener('click', async ()=>{
        const username = sessionStorage.getItem('usuario_actual'); const pass = sessionStorage.getItem('pass_actual');
        if(!username || !pass) return alert('Inicia sesión');
        try{
          const resp = await fetch(API_URL + '/role-requests', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ requested_role: 'COLABORADOR', username, password: pass }) });
          if(!resp.ok) return alert('Error enviando solicitud');
          alert('Solicitud enviada al administrador');
        }catch(e){ console.error(e); alert('Error'); }
      });

      // cerrar sesión (frontend)
      document.getElementById('cerrar').addEventListener('click', ()=>{
        try{ sessionStorage.removeItem('usuario_actual'); sessionStorage.removeItem('pass_actual'); }catch(e){}
        showSession(null); loadQuestions();
      });

      // inicial
      (async ()=>{ const me = await getCurrentUser(); showSession(me); await loadQuestions(); })();

      // actualizar si el header avisa de cambio de auth
      window.addEventListener('sf:auth-changed', async ()=>{ const me = await getCurrentUser(); showSession(me); await loadQuestions(); });
    })();
  </script>

        <a class="footer-link" href="https://mail.google.com/mail/u/0/?view=cm&fs=1&to=janestrada888@gmail.com" target="_blank" rel="noopener">Gmail</a>
      </div>

    </div>
  </footer>
</body>
</html>
