<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Verificar Email</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Verifica tu email</h1>
    <p>Introduce el código que hemos enviado a tu email.</p>
    <form id="verifyForm">
      <label>Email<br><input type="email" id="email" required></label><br>
      <label>Código (6 dígitos)<br><input type="text" id="code" required pattern="\\d{6}"></label><br>
      <button type="submit">Verificar</button>
    </form>
    <div id="msg" role="status"></div>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search);
    const emailInput = document.getElementById('email');
    const codeInput = document.getElementById('code');
    const msg = document.getElementById('msg');
    // Prefill email if viene en la query
    if (params.get('email')) emailInput.value = params.get('email');

    document.getElementById('verifyForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.textContent = '';
      const email = emailInput.value.trim();
      const code = codeInput.value.trim();
      try {
        const res = await fetch('/registro/confirm', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, code })
        });
        const data = await res.json();
        if (!res.ok) {
          msg.textContent = data.detail || data.message || 'Error';
          return;
        }
        msg.textContent = 'Email verificado, ya puedes iniciar sesión';
        // opcional: redirigir al login tras 2s
        setTimeout(() => { window.location.href = 'subscribe.html'; }, 2000);
      } catch (err) {
        msg.textContent = 'Error de red: ' + err.message;
      }
    });
  </script>
</body>
</html>
