<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Verificar Email</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Verifica tu email</h1>
    <div id="banner" class="banner" style="margin-bottom:1rem; padding:0.75rem; background:#eef; border-radius:6px;">
      Introduce el código de verificación que hemos enviado a: <span id="bannerEmail"></span>
      <div id="countdown" style="margin-top:6px; font-weight:600;">El código caduca en: <span id="countdownTimer">00:60</span></div>
    </div>
    <form id="verifyForm">
      <label>Email<br><input type="email" id="email" required readonly></label><br>
      <label>Código (6 dígitos)<br><input type="text" id="code" required pattern="\\d{6}" inputmode="numeric" maxlength="6"></label><br>
      <button type="submit">Verificar</button>
    </form>
    <div id="msg" role="status"></div>
    <div id="resendArea" style="margin-top:1rem; display:block;">
      <p id="expiredMsg" style="color:#a00; visibility:hidden; margin:0 0 .5rem 0"></p>
      <button id="resendBtn" disabled>Reenviar código</button>
    </div>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search);
    const emailInput = document.getElementById('email');
    const codeInput = document.getElementById('code');
    const msg = document.getElementById('msg');
    const bannerEmail = document.getElementById('bannerEmail');
    const resendArea = document.getElementById('resendArea');
    const expiredMsg = document.getElementById('expiredMsg');
    const resendBtn = document.getElementById('resendBtn');
    // Prefill email if viene en la query
    if (params.get('email')) {
      const e = params.get('email');
      emailInput.value = e;
      bannerEmail.textContent = e;
    } else {
      // si no viene, ocultar banner
      document.getElementById('banner').style.display = 'none';
    }

    // Contador de expiración (60s)
    let countdownSeconds = 60;
    let countdownInterval = null;
    const countdownTimer = document.getElementById('countdownTimer');

    function formatTime(s) {
      const mm = Math.floor(s / 60).toString().padStart(2, '0');
      const ss = (s % 60).toString().padStart(2, '0');
      return `${mm}:${ss}`;
    }

    function startCountdown(seconds) {
      clearInterval(countdownInterval);
      countdownSeconds = seconds;
      countdownTimer.textContent = formatTime(countdownSeconds);
      // disable resend while counting
      resendBtn.disabled = true;
      expiredMsg.style.visibility = 'hidden';
      countdownInterval = setInterval(() => {
        countdownSeconds -= 1;
        if (countdownSeconds <= 0) {
          clearInterval(countdownInterval);
          countdownTimer.textContent = formatTime(0);
          // mostrar expirado y permitir reenvío
          expiredMsg.style.visibility = 'visible';
          expiredMsg.style.color = '#a00';
          expiredMsg.textContent = 'Código expirado';
          resendBtn.disabled = false;
        } else {
          countdownTimer.textContent = formatTime(countdownSeconds);
        }
      }, 1000);
    }

    // iniciar en carga
    startCountdown(60);

    // reenviar: llamar al endpoint /registro/resend
    resendBtn.addEventListener('click', async () => {
      expiredMsg.style.visibility = 'hidden';
      resendBtn.disabled = true;
      try {
        const res = await fetch('/registro/resend', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: emailInput.value.trim() })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          const err = data.detail || data.message || 'Error';
          expiredMsg.style.visibility = 'visible';
          expiredMsg.style.color = '#a00';
          expiredMsg.textContent = err;
          resendBtn.disabled = false;
          return;
        }
        expiredMsg.style.visibility = 'visible';
        expiredMsg.style.color = '#080';
        expiredMsg.textContent = 'Código reenviado';
        // reset countdown
        startCountdown(60);
      } catch (err) {
        expiredMsg.style.visibility = 'visible';
        expiredMsg.style.color = '#a00';
        expiredMsg.textContent = 'Error de red: ' + err.message;
        resendBtn.disabled = false;
      }
    });

    document.getElementById('verifyForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.textContent = '';
      const email = emailInput.value.trim();
      const code = codeInput.value.trim();
      try {
        const res = await fetch('/registro/confirm', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, code })
        });
        const data = await res.json();
        if (!res.ok) {
          const status = res.status;
          const err = data.detail || data.message || 'Error';
          if (status === 400) {
            // distinguir entre expirado e inválido
            if (err && (err.toString().toLowerCase().includes('caduc') || err === 'Código expirado')) {
              expiredMsg.style.visibility = 'visible';
              expiredMsg.style.color = '#a00';
              expiredMsg.textContent = 'Código expirado';
              resendBtn.disabled = false;
              msg.textContent = err;
            } else if (err && err.toString().toLowerCase().includes('inválid')) {
              msg.textContent = 'Código incorrecto';
            } else {
              msg.textContent = err;
            }
          } else if (status === 429) {
            msg.textContent = 'Demasiados intentos, espera 15 min';
          } else {
            msg.textContent = err;
          }
          return;
        }
        msg.style.color = '#080';
        msg.textContent = 'Email verificado, cuenta creada';
        // redirigir al inicio (login) tras 1.5s
        setTimeout(() => { window.location.href = 'index.html'; }, 1500);
      } catch (err) {
        msg.textContent = 'Error de red: ' + err.message;
      }
    });
  </script>
</body>
</html>
